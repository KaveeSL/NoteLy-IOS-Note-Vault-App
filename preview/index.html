<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoteLy preview</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --secondary: #6c6c70;
    --tertiary: #8e8e93;
    --fill: #e5e5ea;
    --accent: #e0a000;
    --accent-ink: #1c1c1e;
    --accent-soft: rgba(255, 204, 0, 0.22);
    --danger: #ff3b30;
    --separator: rgba(60, 60, 67, 0.16);
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    --bar: rgba(242, 242, 247, 0.92);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --secondary: #aeaeb2;
      --fill: #2c2c2e;
      --accent: #f0b000;
      --accent-ink: #1c1c1e;
      --accent-soft: rgba(255, 214, 10, 0.2);
      --separator: rgba(84, 84, 88, 0.65);
      --bar: rgba(28, 28, 30, 0.92);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px 16px;
    background: radial-gradient(1200px 500px at 50% -10%, #ffe9a3, transparent 60%), #e7ebf0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color: var(--text);
  }
  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(900px 400px at 50% -10%, #3a320c, transparent 55%), #0e1114; }
  }
  .banner { max-width: 440px; text-align: center; color: #3a4450; font-size: 14px; line-height: 1.45; }
  @media (prefers-color-scheme: dark) { .banner { color: #c5ced6; } }
  .phone {
    width: 390px; height: 844px; max-height: calc(100vh - 108px);
    background: var(--bg); border-radius: 46px;
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.35);
    overflow: hidden; position: relative; display: flex; flex-direction: column;
  }
  .status { height: 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 8px; font-size: 15px; font-weight: 650; flex: none; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 118px; height: 34px; background: #111; border-radius: 20px; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 132px; height: 5px; border-radius: 3px; background: var(--text); opacity: 0.8; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .screen > div:not(.sheet):not(.redirect) { flex: 1; min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow: auto; min-height: 0; }
  .scroll:has(.splash) { display: flex; flex-direction: column; overflow: hidden; }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 2px 16px 6px; gap: 8px; }
  .nav h1 { margin: 0; font-size: 34px; letter-spacing: -0.6px; font-weight: 750; }
  .nav.inline h1 { font-size: 17px; font-weight: 650; letter-spacing: 0; }
  button { font: inherit; }
  .icon-btn, .text-btn { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 8px; border-radius: 10px; cursor: pointer; }
  .search {
    margin: 0 16px 8px; border: 0; background: var(--fill); color: var(--text);
    border-radius: 12px; padding: 10px 12px 10px 34px; font: inherit; font-size: 17px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='%238e8e93' viewBox='0 0 16 16'><path d='M11.7 10.3a6 6 0 1 0-1.4 1.4l3.5 3.5 1.4-1.4-3.5-3.5zM6.5 11a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z'/></svg>");
    background-repeat: no-repeat; background-position: 12px 50%;
  }
  .group { margin: 0 16px 14px; background: var(--card); border-radius: 12px; overflow: hidden; }
  .group h2 { margin: 0; padding: 14px 16px 6px; font-size: 13px; letter-spacing: 0.4px; color: var(--secondary); font-weight: 650; }
  .row { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; color: inherit; padding: 12px 14px; cursor: pointer; border-top: 1px solid var(--separator); }
  .group .row:first-of-type { border-top: 0; }
  .row .main { flex: 1; min-width: 0; }
  .row strong { display: block; font-size: 17px; }
  .row p { margin: 2px 0 0; color: var(--secondary); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { color: var(--secondary); font-size: 17px; }
  .folder { width: 28px; text-align: center; color: var(--accent); font-size: 22px; }
  .swipe { position: relative; overflow: hidden; }
  .swipe-actions { position: absolute; inset: 6px 8px 6px auto; display: flex; gap: 6px; align-items: center; }
  .swipe-actions button { border: 0; color: #fff; border-radius: 16px; height: 36px; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .swipe .row { position: relative; background: var(--card); touch-action: pan-y; }
  .pin { background: var(--accent-soft); }
  .actions { display: flex; gap: 6px; }
  .mini { border: 0; background: var(--fill); color: var(--accent); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; }
  .mini.danger { color: var(--danger); }
  .bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 16px calc(18px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bar) 72%, transparent);
    backdrop-filter: blur(28px) saturate(1.6);
    border-top: 0;
  }
  .format {
    flex: none; display: flex; gap: 6px; margin: 0 12px 10px; padding: 6px 8px;
    border-radius: 26px;
    background: color-mix(in srgb, var(--card) 55%, transparent);
    backdrop-filter: blur(24px) saturate(1.5);
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.45);
  }
  .when { float: right; color: var(--accent); font-size: 12px; font-weight: 600; }
  .bar .search { margin: 0; flex: 1; border-radius: 22px; }
  .compose {
    width: 48px; height: 48px; border-radius: 50%; border: 0; flex: none; cursor: pointer;
    background: color-mix(in srgb, var(--card) 72%, transparent);
    backdrop-filter: blur(18px); font-size: 20px; color: var(--accent);
  }
  .done {
    width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--accent);
    color: #fff; font-weight: 700; cursor: pointer;
  }
  .redirect {
    position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; background: #fff; color: #1c1c1e; text-align: center;
    padding: 24px;
  }
  .redirect strong { font-size: 20px; }
  .load-ring {
    width: 148px; height: 148px; border-radius: 50%;
    display: grid; place-items: center; position: relative;
    background: conic-gradient(from 20deg, #ff3b30 0 90deg, rgba(28,28,30,0.12) 90deg 360deg);
    animation: spin 1s linear infinite;
  }
  .load-ring::after {
    content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #fff;
  }
  .load-logo { position: relative; z-index: 1; font-size: 64px; animation: spin 1s linear infinite reverse; }
  @media (prefers-color-scheme: dark) {
    .redirect { background: #000; color: #f2f2f7; }
    .load-ring::after { background: #000; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .vault-tone { --accent: #ff3b30; --accent-ink: #fff; --accent-soft: rgba(255, 59, 48, 0.16); }
  .bar .grow { flex: 1; text-align: center; color: var(--secondary); font-size: 13px; }
  .primary, .secondary-btn { border: 0; cursor: pointer; }
  .primary {
    border-radius: 25px; min-height: 50px; padding: 0 16px; font-size: 17px; font-weight: 600;
    background: color-mix(in srgb, var(--accent) 72%, white);
    color: #1c1c1e;
    width: 100%;
    backdrop-filter: blur(18px) saturate(1.5);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }
  .setup-mark { font-size: 26px; margin: 4px 0 6px; text-align: left; }
  .show-row { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding-right: 4px; font-size: 17px; }
  .show-row i { width: 51px; height: 31px; border-radius: 16px; background: var(--fill); display: block; position: relative; }
  .show-row i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  .code-head { text-align: center; padding-top: 24px; }
  .code-lock { font-size: 42px; margin-bottom: 22px; }
  .code-head h1 { margin: 0; font-size: 20px; letter-spacing: -0.3px; }
  .code-head p { margin: 8px 0 0; color: var(--secondary); font-size: 15px; line-height: 1.35; }
  .code-dots { display: flex; justify-content: center; gap: 18px; padding: 28px 0 4px; }
  .code-dots i { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid rgba(60, 60, 67, 0.45); display: block; box-sizing: border-box; }
  .code-dots i.on { background: var(--text); border-color: var(--text); }
  .splash { flex: 1; min-height: 100%; display: flex; flex-direction: column; }
  .splash-hero {
    flex: 1; min-height: 220px; position: relative; overflow: hidden;
    background: #e0a000 url("welcome-hero.png?v=fade1") center 30% / cover no-repeat;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 74%, rgba(0,0,0,0.82) 84%, rgba(0,0,0,0.4) 92%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 74%, rgba(0,0,0,0.82) 84%, rgba(0,0,0,0.4) 92%, transparent 100%);
  }
  .splash-copy { padding: 8px 28px 8px; background: var(--bg); position: relative; z-index: 1; }
  .splash-brand { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; }
  .splash-brand span { font-size: 18px; }
  .splash-copy h1 { margin: 2px 0 0; font-size: 34px; letter-spacing: -0.7px; line-height: 1.05; }
  .splash-symbol { font-size: 26px; margin: 20px 0 12px; }
  .splash-copy p { margin: 0; font-size: 15px; line-height: 1.35; color: var(--secondary); }
  .splash-copy p.splash-link { color: var(--accent); margin-top: 6px; }
  .glass-field {
    width: 100%; border: 0; border-radius: 18px; padding: 14px 16px; font: inherit; font-size: 17px;
    background: rgba(255, 255, 255, 0.55); color: var(--text);
    backdrop-filter: blur(16px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }
  @media (prefers-color-scheme: dark) {
    .glass-field { background: rgba(44, 44, 46, 0.72); }
  }
  .secondary-btn { background: transparent; color: var(--secondary); width: 100%; min-height: 44px; font-size: 15px; }
  .pad { padding: 8px 28px 16px; display: flex; flex-direction: column; gap: 12px; }
  .pad.welcome { gap: 22px; padding-top: 8px; }
  h1.page { margin: 0; font-size: 34px; letter-spacing: -0.7px; }
  .muted, .fine { color: var(--secondary); margin: 0; }
  .muted { font-size: 17px; line-height: 1.35; }
  .fine { font-size: 13px; line-height: 1.4; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 650; }
  input[type="password"], input.title, textarea.body, .field input, .rename {
    width: 100%; border: 0; background: var(--card); color: var(--text); border-radius: 12px; padding: 12px; font: inherit;
  }
  textarea.body { min-height: 220px; resize: none; font-size: 17px; line-height: 1.4; background: transparent; }
  input.title { font-size: 28px; font-weight: 700; background: transparent; padding-left: 0; }
  .field input.glass-field {
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(16px);
    border-radius: 18px;
    padding: 14px 16px;
  }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 8px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--fill); display: block; }
  .dots i.on { background: var(--accent); width: 18px; border-radius: 7px; }
  .welcome-icon { font-size: 34px; width: 64px; height: 64px; margin: 8px auto 18px; display: grid; place-items: center; }
  .feature { display: flex; gap: 14px; align-items: flex-start; }
  .feature span {
    width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center;
    background: var(--accent-soft); font-size: 14px; flex: none; margin-top: 2px;
  }
  .feature strong { font-size: 17px; font-weight: 600; }
  .feature p { margin: 3px 0 0; font-size: 15px; }
  .pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pin {
    border: 0; height: 56px; border-radius: 28px; font: inherit; font-size: 22px; font-weight: 600;
    background: rgba(255, 255, 255, 0.55); color: var(--text); cursor: pointer;
    backdrop-filter: blur(16px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }
  .footer-btn { flex: none; padding: 12px 32px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--bg); }
  .footer-btn.welcome-foot { padding-left: 32px; padding-right: 32px; }
  .primary.welcome-btn { min-height: 68px; border-radius: 34px; font-size: 17px; }
  .footer-btn .primary {
    background: rgba(255, 255, 255, 0.42);
    color: #1c1c1e;
    backdrop-filter: blur(22px) saturate(1.8);
    -webkit-backdrop-filter: blur(22px) saturate(1.8);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -0.5px 0 rgba(0, 0, 0, 0.05);
    border: 0.5px solid rgba(255, 255, 255, 0.7);
  }
  .footer-btn .primary.welcome-btn {
    background: color-mix(in srgb, #e0a000 68%, rgba(255, 255, 255, 0.55));
    color: #1c1c1e;
    border-color: rgba(255, 220, 90, 0.9);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), inset 0 -1px 0 rgba(160, 96, 0, 0.28);
  }
  @media (prefers-color-scheme: dark) {
    .footer-btn .primary { background: rgba(255, 255, 255, 0.14); color: #f2f2f7; border-color: rgba(255, 255, 255, 0.2); }
    .footer-btn .primary.welcome-btn { background: color-mix(in srgb, #f0b000 62%, rgba(255, 255, 255, 0.16)); color: #1c1c1e; }
  }
  .sheet { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: flex-end; z-index: 5; }
  .sheet-card { width: 100%; background: var(--card); border-radius: 22px 22px 0 0; padding: 18px 18px 28px; }
  .sheet-card h2 { margin: 8px 0 4px; font-size: 20px; text-align: center; }
  .error { color: var(--danger); font-size: 14px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
  .chip { border: 0; background: var(--fill); color: var(--text); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--accent); color: var(--accent-ink); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 4px 16px 16px; }
  .tile { border: 0; background: var(--card); border-radius: 12px; padding: 0; overflow: hidden; text-align: left; color: inherit; cursor: pointer; }
  .thumb { height: 92px; display: grid; place-items: center; font-size: 28px; background: var(--accent-soft); }
  .tile span { display: block; font-size: 12px; padding: 6px 8px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: flex; margin: 0 16px 8px; background: var(--fill); border-radius: 10px; padding: 2px; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 7px; cursor: pointer; color: var(--text); font-weight: 600; }
  .seg button.on { background: var(--card); color: var(--accent); }
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 16px 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 12px; min-height: 120px; border: 0; text-align: left; color: inherit; cursor: pointer; }
  .card strong { display: block; margin-bottom: 6px; }
  .card p { margin: 0; color: var(--secondary); font-size: 14px; }
  .empty { padding: 28px 24px 8px; text-align: center; color: var(--secondary); }
  .empty strong { display: block; color: var(--text); font-size: 17px; }
  .empty span { display: block; margin-top: 4px; font-size: 15px; }
  @media (max-width: 520px) {
    body { padding: 0; gap: 0; justify-content: flex-start; background: var(--bg); }
    .banner { max-width: none; font-size: 12px; padding: 10px 14px 6px; }
    .phone { width: 100%; height: calc(100dvh - 48px); max-height: none; border-radius: 0; box-shadow: none; }
    .island, .home, .status { display: none; }
  }
</style>
</head>
<body>
<p class="banner"><strong>Web preview.</strong> Clickable mock of the latest NoteLy screens. It does not encrypt anything and it is not the iOS app. Refresh after each update.</p>
<div class="phone">
  <div class="island"></div>
  <div class="status"><span id="clock">9:41</span><span>5G</span></div>
  <div class="screen" id="screen"></div>
  <div class="home"></div>
</div>
<script>
const day = 86400000;
const now = Date.now();
const state = {
  screen: "onboard",
  page: 0,
  pin: "",
  pinAgain: "",
  pinConfirming: false,
  faceSetup: true,
  phrase: "",
  face: false,
  query: "",
  layout: "list",
  folderName: "Notes",
  vaultTab: "folders",
  fileFilter: "All",
  fileQuery: "",
  viewer: null,
  notes: [
    { id: 1, title: "Grocery list", body: "Milk, oats, coffee, apples.", updated: now - 3600000, pinned: false, deleted: null },
    { id: 2, title: "Weekend", body: "Walk, farmers market, call family.", updated: now - day, pinned: true, deleted: null },
    { id: 3, title: "Ideas", body: "A few thoughts to come back to.", updated: now - 8 * day, pinned: false, deleted: null }
  ],
  folders: ["Notes", "Recently Deleted"],
  vaultNotes: [],
  files: [
    { id: "a", name: "Beach.jpg", kind: "Photos", favorite: false, folder: "" },
    { id: "b", name: "Lecture.pdf", kind: "Documents", favorite: true, folder: "" },
    { id: "c", name: "Clip.mp4", kind: "Videos", favorite: false, folder: "" }
  ],
  vaultFolders: [{ name: "Extra Private", code: "" }],
  openFolder: "",
  fileGallery: true,
  redirecting: false,
  locking: false,
  nextId: 4
};

const weak = new Set(["password", "password1", "unlock", "12345678", "qwerty", "qwertyui", "letmein", "welcome", "work", "todo", "shopping", "notes", "meeting", "ideas", "grocery"]);

function normalize(value) {
  return value.trim().toLowerCase();
}
function strength(value) {
  const text = normalize(value);
  if (phraseError(text) || text.length < 12) return "Weak";
  const kinds = [/\p{L}/u.test(text), /\d/.test(text), /[^\p{L}\d]/u.test(text)].filter(Boolean).length;
  if (text.length >= 16 && kinds >= 2) return "Strong";
  return "OK";
}
function phraseError(text) {
  if (!text) return "Enter a phrase.";
  if (text.length < 8) return "Use at least 8 characters.";
  if (text.length > 64) return "Use 64 characters or fewer.";
  if (new Set(text).size <= 1) return "Don't use the same character repeated.";
  const alphabet = "abcdefghijklmnopqrstuvwxyz0123456789";
  if (text.length >= 4 && (alphabet.includes(text) || alphabet.split("").reverse().join("").includes(text))) {
    return "Don't use a sequence like 12345678 or abcdefgh.";
  }
  if (weak.has(text)) return "Choose a phrase that isn't a common word or a typical note search.";
  return "";
}
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}
function button(label, className, action) {
  const node = el("button", className, label);
  node.type = "button";
  node.onclick = action;
  return node;
}
function icon(symbol, label, action) {
  const node = button(symbol, "icon-btn", action);
  node.setAttribute("aria-label", label);
  return node;
}

function render() {
  const root = document.getElementById("screen");
  root.replaceChildren();
  const view = {
    onboard, folders, notes, editor, settings, vault, vaultSettings, fileViewer
  }[state.screen]();
  root.append(view);
  if (state.face) root.append(faceSheet());
}

function column(title, leading, trailing) {
  const screen = el("div");
  const nav = el("div", "nav");
  nav.append(leading || el("span"));
  nav.append(el("h1", "", title));
  nav.append(trailing || el("span"));
  const body = el("div", "scroll");
  screen.append(nav, body);
  return { screen, body, nav };
}

function onboard() {
  const screen = el("div");
  const wrap = el("div", "scroll");
  const box = el("div", state.page === 0 ? "splash" : "pad");
  if (state.page === 0) {
    const hero = el("div", "splash-hero");
    const copy = el("div", "splash-copy");
    copy.append(el("h1", "", "Welcome to NoteLy"));
    copy.append(el("div", "splash-symbol", "📁"));
    copy.append(el("p", "", "Notes stay on this iPhone. Search a secret phrase to open a hidden space, then set a code. Face ID is optional."));
    box.append(hero, copy);
  } else if (state.page === 1) {
    box.append(el("div", "setup-mark", "🔍"));
    box.append(el("h1", "page", "Your phrase"));
    box.append(el("p", "muted", "You'll type this in Search later. Pick something you would never search for a note."));
    box.append(field("Phrase", "phrase"));
    box.append(field("Type it again", "confirm"));
    const show = el("div", "show-row");
    show.append(el("span", "", "Show phrase"));
    show.append(el("i"));
    box.append(show);
    const live = el("p", "fine", "");
    const phraseInput = box.querySelector("input");
    const paint = () => { live.textContent = phraseInput.value ? "Strength: " + strength(phraseInput.value) : "8 or more characters"; };
    phraseInput.addEventListener("input", paint);
    paint();
    box.append(live);
    if (state.message) box.append(el("p", "error", state.message));
  } else if (state.page === 2) {
    const head = el("div", "code-head");
    head.append(el("div", "code-lock", "🔒"));
    head.append(el("h1", "", state.pinConfirming ? "Type it again" : "Choose a 6-digit code"));
    head.append(el("p", "", state.pinConfirming ? "Enter the same six digits to confirm." : "Type six digits for the hidden space. You'll enter them once more to confirm."));
    box.append(head);
    const dots = el("div", "code-dots");
    const current = state.pinConfirming ? state.pinAgain : state.pin;
    for (let i = 0; i < 6; i++) dots.append(el("i", i < current.length ? "on" : ""));
    box.append(dots);
    const pad = el("div", "pinpad");
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "⌫"].forEach((label) => {
      pad.append(button(label, "pin", () => {
        const key = state.pinConfirming ? "pinAgain" : "pin";
        if (label === "C") {
          state[key] = "";
        } else if (label === "⌫") {
          state[key] = state[key].slice(0, -1);
          if (state.pinConfirming && !state.pinAgain) state.pinConfirming = false;
        } else if (state[key].length < 6) {
          state[key] += label;
          if (!state.pinConfirming && state.pin.length === 6) state.pinConfirming = true;
        }
        state.message = "";
        render();
      }));
    });
    box.append(pad);
    if (state.message) box.append(el("p", "error", state.message));
  } else {
    box.append(el("div", "setup-mark", "🙂"));
    box.append(el("h1", "page", "Face ID"));
    box.append(el("p", "muted", "Optional. Your code still opens it. This preview does not encrypt and is not the iOS app."));
    const toggle = button(state.faceSetup ? "Face ID on" : "Face ID off", "secondary-btn", () => {
      state.faceSetup = !state.faceSetup;
      render();
    });
    box.append(toggle);
  }
  wrap.append(box);
  const foot = el("div", state.page === 0 ? "footer-btn welcome-foot" : "footer-btn");
  const titles = ["Get Started", "Continue", "Continue", "Start using the app"];
  foot.append(button(titles[state.page] || "Continue", state.page === 0 ? "primary welcome-btn" : "primary", () => advanceSetup(box)));
  screen.append(wrap, foot);
  return screen;
}

function advanceSetup(box) {
  state.message = "";
  if (state.page === 1) {
    const inputs = box.querySelectorAll("input");
    const phrase = normalize(inputs[0].value);
    const error = phraseError(phrase);
    if (error) { state.message = error; render(); return; }
    if (phrase !== normalize(inputs[1].value)) { state.message = "Those phrases don't match."; render(); return; }
    state.phrase = phrase;
  }
  if (state.page === 2) {
    if (state.pin.length !== 6 || state.pin !== state.pinAgain) {
      state.message = "Enter the same 6 digits twice.";
      render();
      return;
    }
  }
  if (state.page >= 3) {
    state.screen = "folders";
    state.page = 0;
    render();
    return;
  }
  state.page += 1;
  render();
}

function field(label, name) {
  const wrap = el("label", "field", label);
  const input = document.createElement("input");
  input.type = "password";
  input.className = "glass-field";
  input.autocomplete = "off";
  input.name = name;
  wrap.append(input);
  return wrap;
}

function enableVault(box) {
  const inputs = box.querySelectorAll("input");
  const phrase = normalize(inputs[0].value);
  const error = phraseError(phrase);
  if (error) { state.message = error; render(); return; }
  if (phrase !== normalize(inputs[1].value)) { state.message = "Those phrases don't match."; render(); return; }
  state.phrase = phrase;
  state.message = "";
  state.face = "setup";
  render();
}

function searchField() {
  const search = document.createElement("input");
  search.className = "search";
  search.placeholder = "Search";
  search.setAttribute("aria-label", "Search notes");
  search.autocomplete = "off";
  search.spellcheck = false;
  search.value = state.query;
  search.oninput = () => {
    state.query = search.value;
    if (state.screen === "notes") paintNotes();
  };
  search.onkeydown = (event) => {
    if (event.key !== "Enter") return;
    event.preventDefault();
    const typed = normalize(search.value);
    if (state.phrase && typed === state.phrase) {
      state.query = "";
      state.face = "vault";
      render();
    }
  };
  return search;
}

let paintNotes = () => {};

      move.style.background = "#7c5cfc";

    }

      });
      remove.style.background = "#ff3b30";

    row.append(main, el("span", "count", String(count) + " ›"));

    let dragged = false;
    row.addEventListener("pointerdown", (event) => { startX = event.clientX; dragged = false; });
    row.addEventListener("pointermove", (event) => {
      const dx = Math.min(0, event.clientX - startX);
      if (dx < -8) dragged = true;
      row.style.transform = "translateX(" + dx + "px)";
    });
    row.addEventListener("pointerup", () => {
      const open = dragged;
      row.style.transition = "transform .22s ease";
      row.style.transform = open ? "translateX(-" + (actions.children.length * 86) + "px)" : "translateX(0)";
      setTimeout(() => { row.style.transition = ""; }, 220);
    });
    row.addEventListener("pointercancel", () => { row.style.transform = "translateX(0)"; });
    row.onclick = () => {

      state.folderName = name;
      state.query = "";
      state.screen = "notes";
      render();
    };
    slide.append(actions, row);
    section.append(slide);

function notes() {
  const deleted = state.folderName === "Recently Deleted";
  const { screen, body, nav } = column(
    state.folderName,
    button("Folders", "text-btn", () => { state.screen = "folders"; render(); }),
    icon(state.layout === "list" ? "▦" : "☰", "View options", () => {
      state.layout = state.layout === "list" ? "gallery" : "list";
      render();
    })
  );
  nav.classList.add("inline");
  const search = searchField();
  const list = el("div");
  function paint() {
    list.replaceChildren();
    const query = state.query.trim().toLowerCase();
    let items = state.notes.filter((note) => deleted ? note.deleted : !note.deleted);
    if (!deleted && query) {
      items = items.filter((note) => (note.title + " " + note.body).toLowerCase().includes(query));
    }
    if (!items.length) {
      const empty = el("div", "empty");
      empty.append(el("strong", "", query ? "No matching notes" : (deleted ? "No deleted notes" : "No Notes")));
      empty.append(el("span", "", query ? "Try a different word." : "Capture a thought. It stays on this device."));
      list.append(empty);
      return;
    }
    if (state.layout === "gallery" && !deleted) {
      const grid = el("div", "gallery");
      items.forEach((note) => {
        const card = el("button", "card");
        card.append(el("strong", "", note.title || "New Note"), el("p", "", note.body || "No additional text"));
        card.onclick = () => openNote(note);
        grid.append(card);
      });
      list.append(grid);
    } else {
      const groups = deleted ? [{ title: "RECENTLY DELETED", items }] : groupNotes(items);
      groups.forEach((group) => {

        box.append(el("h2", "", group.title));
        group.items.forEach((note) => box.append(noteRow(note, deleted)));

      });

    if (!deleted) list.append(el("p", "fine", items.length + " Notes"));
  }
  body.append(list);

  const bar = el("div", "bar");
  if (deleted) {

      state.notes = state.notes.filter((note) => !note.deleted);
      render();
    }));
  } else {
    bar.append(search, button("✎", "compose", () => {
      const note = { id: state.nextId++, title: "", body: "", updated: Date.now(), pinned: false, deleted: null };
      state.notes.unshift(note);
      openNote(note);
    }));
    bar.lastChild.setAttribute("aria-label", "New note");
  }
  screen.append(bar);
  return screen;
}

function groupNotes(items) {
  const pinned = items.filter((note) => note.pinned);
  const rest = items.filter((note) => !note.pinned);
  const groups = [];
  if (pinned.length) groups.push({ title: "PINNED", items: pinned });
  const buckets = new Map();
  rest.forEach((note) => {
    const age = now - note.updated;
    const title = age < day ? "TODAY" : age < 2 * day ? "YESTERDAY" : age < 7 * day ? "PREVIOUS 7 DAYS" : "PREVIOUS 30 DAYS";
    if (!buckets.has(title)) buckets.set(title, []);
    buckets.get(title).push(note);
  });
  buckets.forEach((value, title) => groups.push({ title, items: value }));
  return groups;
}

function noteRow(note, deleted) {
  const row = el("div", "row" + (note.pinned ? " pin" : ""));
  const main = el("button", "main");
  main.style.border = "0";
  main.style.background = "transparent";
  main.style.color = "inherit";
  main.style.textAlign = "left";
  main.style.cursor = "pointer";
  main.style.padding = "0";
  const title = el("strong", "", note.title || "New Note");
  title.append(el("span", "when", new Date(note.updated).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })));
  main.append(title);
  main.append(el("p", "", note.body || "No additional text"));
  main.onclick = () => openNote(note);
  const actions = el("div", "actions");
  if (deleted) {
    actions.append(button("Recover", "text-btn", () => { note.deleted = null; render(); }));
  } else {
    actions.append(button(note.pinned ? "📌" : "📍", "mini", () => { note.pinned = !note.pinned; render(); }));
    actions.append(button("🗑", "mini danger", () => { note.deleted = Date.now(); note.pinned = false; render(); }));
  }
  row.append(main, actions);
  return row;
}

function openNote(note) {
  state.editing = note.id;
  state.screen = "editor";
  render();
}

function editor() {
  const note = state.notes.find((item) => item.id === state.editing) || state.vaultNotes.find((item) => item.id === state.editing);
  const vault = state.vaultNotes.includes(note);
  const trail = el("div");
  trail.style.display = "flex";
  trail.style.gap = "8px";
  trail.style.alignItems = "center";
  trail.append(icon(note.pinned ? "📌" : "📍", "Pin", () => {
    note.pinned = !note.pinned;
    render();
  }));
  trail.append(button("✓", "done", () => closeEditor(note, vault)));
  trail.lastChild.setAttribute("aria-label", "Done");
  const { screen, body, nav } = column("", button("‹", "icon-btn", () => closeEditor(note, vault)), trail);
  if (vault) screen.classList.add("vault-tone");
  nav.classList.add("inline");
  const title = document.createElement("input");
  title.className = "title";
  title.placeholder = "Title";
  title.setAttribute("aria-label", "Title");
  title.value = note.title;
  const area = document.createElement("textarea");
  area.className = "body";
  area.placeholder = "Start writing";
  area.setAttribute("aria-label", "Note body");
  area.value = note.body;
  const save = () => {
    note.title = title.value;
    note.body = area.value;
    note.updated = Date.now();
    nav.querySelector("h1").textContent = note.title || "New Note";
  };
  title.oninput = save;
  area.oninput = save;
  const when = el("p", "fine", new Date(note.updated).toLocaleString([], { day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit" }));
  const pad = el("div", "pad");
  pad.append(when, title, area);
  body.append(pad);
  const format = el("div", "format");
  ["✓", "Aa", "📷", "✎"].forEach((symbol) => {
    format.append(button(symbol, "icon-btn", () => {
      if (symbol === "✓") area.value += (area.value ? "\n" : "") + "○ ";
      if (symbol === "Aa") area.value += (area.value && !area.value.endsWith("\n") ? "\n" : "") + note.title;
      save();
    }));
  });
  screen.append(format);
  return screen;
}

function closeEditor(note, vault) {
  if (!note.title.trim() && !note.body.trim()) {
    const list = vault ? state.vaultNotes : state.notes;
    const index = list.indexOf(note);
    if (index >= 0) list.splice(index, 1);
  }
  state.screen = vault ? "vault" : "notes";
  render();
}

function visibleFiles() {
  return state.files.filter((file) => {
    const folder = file.folder || "";
    if (state.openFolder) {
      if (folder !== state.openFolder) return false;
    }
    if (state.fileFilter === "Favorites" && !file.favorite) return false;
    if (state.fileFilter !== "All" && state.fileFilter !== "Favorites" && file.kind !== state.fileFilter) return false;
    if (state.fileQuery && !file.name.toLowerCase().includes(state.fileQuery.trim().toLowerCase())) return false;
    return true;
  });
}

function addFile() {
  const names = ["Scan.pdf", "Receipt.jpg", "Voice.m4a", "Notes.txt"];
  const kinds = ["Documents", "Photos", "Videos", "Documents"];
  const index = state.files.length % names.length;
  state.files.unshift({ id: "f" + state.nextId++, name: names[index], kind: kinds[index], favorite: false, folder: state.openFolder || "" });
  state.vaultTab = "files";
  render();
}

function fileViewer() {
  const file = state.files.find((item) => item.id === state.viewer);
  const { screen, body } = column(file ? file.name : "File", button("Files", "text-btn", () => {
    state.screen = "vault";
    state.vaultTab = "files";
    render();
  }), button(file && file.favorite ? "Unfavorite" : "Favorite", "text-btn", () => {
    if (!file) return;
    file.favorite = !file.favorite;
    render();
  }));
  const box = el("div", "pad");
  box.append(el("div", "thumb", "📄"));
  box.append(el("p", "muted", "In the real app this opens a photo, video, PDF, or document viewer. Nothing here is decrypted."));
  box.append(button("Export", "primary", () => {
    box.append(el("p", "fine", "Exported files leave the protected vault."));
  }));
  box.append(button("Delete", "secondary-btn", () => {
    state.files = state.files.filter((item) => item.id !== file.id);
    state.screen = "vault";
    state.vaultTab = "files";
    render();
  }));
  body.append(box);
  return screen;
}

function faceSheet() {
  const sheet = el("div", "sheet");
  const card = el("div", "sheet-card");
  card.append(el("div", "folder", "🙂"));
  card.append(el("h2", "", "Unlock your notes"));
  card.append(el("p", "fine", "Simulated prompt. The real app uses Face ID or the device passcode."));
  if (state.face === "change") {
    const next = document.createElement("input");
    next.placeholder = "New phrase";
    next.autocomplete = "off";
    const again = document.createElement("input");
    again.placeholder = "Confirm new phrase";
    again.autocomplete = "off";
    card.append(next, again);
    card.append(button("Confirm with Face ID", "primary", () => {
      const phrase = normalize(next.value);
      if (phraseError(phrase)) { state.message = phraseError(phrase); render(); return; }
      if (phrase !== normalize(again.value)) { state.message = "Those phrases don't match."; render(); return; }
      state.phrase = phrase;
      state.message = "";
      state.face = false;
      state.screen = "vault";
      render();
    }));
  } else {
  card.append(button(state.face === "setup" ? "Confirm" : "Unlock", "primary", () => {
    const setup = state.face === "setup";
    state.face = false;
    if (setup) {
      state.screen = "folders";
      render();
    } else {
      showRedirect();
    }
  }));
  }
  card.append(button("Cancel", "secondary-btn", () => {
    if (state.face === "setup") state.phrase = "";
    state.face = false;
    render();
  }));
  sheet.append(card);
  return sheet;
}

function tick() {
  const clock = document.getElementById("clock");
  if (clock) clock.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
tick();
setInterval(tick, 10000);
render();
</script>
</body>
</html>
